<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rival AoE2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#232B35; --stone-2:#2C3643; --line:#3A4654;
    --bone:#ECE6D8; --ash:#9BA5B0; --gold:#D4AF52; --win:#6FBF73; --loss:#E0685C;
    --mine:#5EEAD4; --theirs:#F3C46A;
    --display:"Alegreya SC", Georgia, "Times New Roman", serif;
    --body:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;min-height:100%}
  body{background:var(--stone);color:var(--bone);font:17px/1.45 var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:18px 24px 40px}
  a{color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .status{display:flex;align-items:center;gap:8px;color:var(--ash);font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ash);flex:none}
  .dot.live{background:var(--win);animation:pulse 2s infinite}
  .dot.off{background:var(--loss)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,191,115,.55)}70%,100%{box-shadow:0 0 0 8px rgba(111,191,115,0)}}
  .left{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap}
  .tabs{display:flex;gap:3px;background:var(--stone-2);padding:3px;border-radius:8px}
  .tabs a{color:var(--ash);text-decoration:none;font-weight:700;font-size:15px;padding:5px 14px;border-radius:6px}
  .tabs a[aria-current="page"]{background:var(--stone);color:var(--bone)}
  .bell{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ash);font-size:15px;padding:4px 8px;border-radius:6px}
  .bell[aria-pressed="true"]{color:var(--gold)}
  .bell:focus-visible{outline:2px solid var(--gold)}
  .bell svg{width:16px;height:16px}
  form{display:flex;gap:8px;align-items:center}
  label{color:var(--ash);font-size:15px}
  input{background:var(--stone-2);border:1px solid var(--line);color:var(--bone);font:inherit;padding:6px 10px;border-radius:6px;width:9em}
  #pid{width:13em}
  input::placeholder{color:var(--ash)}
  button{background:var(--gold);color:#221c0c;border:0;font:700 15px var(--body);padding:8px 14px;border-radius:6px;cursor:pointer}

  .scene{margin-top:22px}
  .meta{display:flex;gap:2px 16px;flex-wrap:wrap;color:var(--ash);font-size:14px;min-width:0}
  .flag{height:12px;vertical-align:-1px;margin-right:5px;border-radius:2px}
  .pid{font:400 13px var(--body);color:var(--ash);font-variant-numeric:tabular-nums;white-space:nowrap}
  a[data-player]{color:inherit;text-decoration:none}
  a[data-player]:hover{text-decoration:underline}
  .seg{display:flex;gap:3px;background:var(--stone-2);padding:3px;border-radius:8px}
  .seg button{background:transparent;color:var(--ash);font:700 15px var(--body);padding:5px 14px;border-radius:6px}
  .seg button[aria-pressed="true"]{background:var(--gold);color:#221c0c}
  .seg button:focus-visible{outline:2px solid var(--gold)}

  .duels{display:flex;flex-direction:column;gap:16px}
  .match{background:var(--stone-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px;border-bottom:1px solid var(--line)}
  .mapimg{width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--stone);flex:none}
  .mtitle{flex:1 1 260px;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 14px}
  .mapname{font:800 28px/1.1 var(--display);margin:0}
  .modes{display:flex;gap:4px 16px;flex-wrap:wrap;color:var(--ash);font-size:15px;margin-top:2px}
  .chip{font-weight:700;font-size:14px;padding:3px 12px;border-radius:6px;white-space:nowrap}
  .chip.win,.chip.live{background:rgba(111,191,115,.16);color:var(--win)}
  .chip.loss{background:rgba(224,104,92,.16);color:var(--loss)}
  .chip.none{background:var(--stone);color:var(--ash)}
  a.rec{color:var(--gold);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  a.rec:hover{text-decoration:underline}
  a.rec.off{color:var(--ash)}
  a.rec svg{width:16px;height:16px;flex:none}

  /* Duelos: tu equipo a la izquierda y los rivales a la derecha, cada uno ordenado por rating. */
  .duel{padding:12px 20px 18px;overflow-x:auto}
  .dgrid{display:flex;flex-direction:column;gap:8px}
  .d-row,.d-avg{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) 72px minmax(0,1fr) minmax(150px,230px);column-gap:10px;align-items:center}
  .d-avg .a{font:700 22px/1 var(--body);font-variant-numeric:tabular-nums}
  .d-avg .a.l{text-align:right;color:var(--mine)}
  .d-avg .a.r{color:var(--theirs)}
  .d-vs{text-align:center}
  .dchip{display:inline-block;min-width:52px;padding:2px 8px;border-radius:6px;font:700 14px var(--body);font-variant-numeric:tabular-nums}
  .dchip.pos{background:rgba(111,191,115,.16);color:var(--win)}
  .dchip.neg{background:rgba(224,104,92,.16);color:var(--loss)}
  .d-id{min-width:0}
  .d-id.d-r{text-align:right}
  .d-top{display:flex;align-items:center;gap:8px;min-width:0}
  .d-id.d-r .d-top{justify-content:flex-end}
  .d-civ{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--pc,var(--line));background:var(--stone);object-fit:cover}
  .d-name{font:500 18px/1.2 var(--body);overflow-wrap:anywhere;min-width:0}
  .d-name.me{font-weight:700;color:var(--gold)}
  .crown{width:18px;height:18px;flex:none;color:var(--gold)}
  .d-sub{color:var(--ash);font-size:13px;font-variant-numeric:tabular-nums}
  .d-id.d-l .d-sub{margin:1px 0 0 42px}
  .d-id.d-r .d-sub{margin:1px 42px 0 0}
  .d-track{height:36px;background:var(--stone);display:flex}
  .d-track.d-l{justify-content:flex-end;border-radius:8px 0 0 8px}
  .d-track.d-r{justify-content:flex-start;border-radius:0 8px 8px 0}
  .d-bar{height:36px;min-width:70px;display:flex;align-items:center;padding:0 12px;font:700 17px var(--body);font-variant-numeric:tabular-nums;color:#10202C}
  .d-l .d-bar{background:var(--mine);border-radius:8px 0 0 8px;justify-content:flex-start}
  .d-r .d-bar{background:var(--theirs);border-radius:0 8px 8px 0;justify-content:flex-end}
  .d-bar.na{background:var(--line);color:var(--ash)}
  @media (min-width:721px){.dgrid{min-width:760px}}
  @media (max-width:720px){
    .d-row{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);grid-template-areas:"il vs ir" "tl . tr";row-gap:4px}
    .d-row .d-id.d-l{grid-area:il} .d-row .d-id.d-r{grid-area:ir} .d-row .d-vs{grid-area:vs}
    .d-row .d-track.d-l{grid-area:tl} .d-row .d-track.d-r{grid-area:tr}
    .d-avg{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr)}
    .d-avg .sp{display:none}
    .d-name{font-size:16px}
    .d-civ{width:28px;height:28px}
    .d-id.d-l .d-sub{margin-left:36px}
    .d-id.d-r .d-sub{margin-right:36px}
  }

  .note{background:var(--stone-2);border-radius:10px;padding:20px 22px;max-width:70ch}
  .note h2{font:800 24px/1.2 var(--display);margin:0 0 8px}
  .note p{margin:6px 0;color:var(--ash)}
  .picklist{list-style:none;margin:12px 0 4px;padding:0;display:flex;flex-direction:column;gap:2px}
  .picklist button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;padding:8px 10px;border-radius:6px;color:var(--bone)}
  .picklist button:hover{background:var(--stone)}
  .picklist button:focus-visible{outline:2px solid var(--gold)}
  .picklist strong{font-weight:700}
  .picklist .meta{color:var(--ash);font-size:14px}
  .linkbtn{all:unset;cursor:pointer;color:var(--gold);text-decoration:underline;font-size:15px}
  .linkbtn:focus-visible{outline:2px solid var(--gold)}
  code{background:var(--stone);padding:1px 6px;border-radius:4px;color:var(--bone)}

  .clanhead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 20px;flex-wrap:wrap}
  .clanname{font:800 30px/1.1 var(--display);margin:0}
  .modes .playing{color:var(--win);font-weight:700}
  .tablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:8px}
  table.clan{width:100%;border-collapse:collapse;font-size:16px}
  table.clan th{background:var(--stone-2);text-align:left;padding:0;white-space:nowrap}
  table.clan th button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 14px;font:700 15px var(--body);color:var(--ash)}
  table.clan th button[aria-pressed="true"]{color:var(--bone)}
  table.clan th button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  table.clan th.num button{text-align:right}
  table.clan td{padding:7px 14px;border-top:1px solid var(--line);white-space:nowrap}
  table.clan tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.r1{font-weight:700}
  td.rt{color:var(--ash)}
  td.who a{color:var(--bone);text-decoration:none;font-weight:700}
  td.who a:hover{text-decoration:underline}
  td.who .pid a{color:inherit;font-weight:400}
  tr.you td:first-child{box-shadow:inset 3px 0 var(--gold)}
  a.live{color:var(--win);text-decoration:none;display:inline-flex;align-items:center;gap:7px;vertical-align:top}
  a.live:hover{text-decoration:underline}
  .eye{width:18px;height:18px;flex:none}
  .idle{color:var(--ash)}
  .st-m{display:none;font-size:14px;margin-top:2px}
  .st-m a.live{color:var(--win);font-weight:400}
  @media (max-width:640px){
    table.clan th.st, table.clan td.st{display:none}
    .st-m{display:block}
    table.clan td.who{white-space:normal}
    table.clan td, table.clan th button{padding-left:10px;padding-right:10px}
  }

  .enter{animation:enter .45s ease-out}
  @keyframes enter{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.dot.live,.enter{animation:none}}
  @media (max-width:560px){
    .wrap{padding:14px 16px 32px}
    .mapname{font-size:24px}
    .duel{padding:12px 14px 16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="left">
      <nav class="tabs" aria-label="Secciones">
        <a href="#rival" data-view="rival">Rival</a>
        <a href="#clan" data-view="clan">Clan</a>
      </nav>
      <div class="status" role="status"><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>
      <div class="seg" id="ratingSeg" role="group" aria-label="Rating a comparar">
        <button type="button" data-mode="1v1" aria-pressed="true">1v1</button>
        <button type="button" data-mode="tg" aria-pressed="false">Team Game</button>
      </div>
      <button type="button" class="bell" id="bell" aria-pressed="false" title="Sonar una campanita cuando el jugador seguido arranca una partida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Aviso</button>
    </div>
    <form id="who">
      <label for="pid">Jugador</label>
      <input id="pid" autocomplete="off" spellcheck="false" placeholder="Nombre o profile ID">
      <button type="submit">Ver</button>
    </form>
    <form id="clanForm" hidden>
      <label for="tag">Clan</label>
      <input id="tag" autocomplete="off" spellcheck="false">
      <button type="submit">Ver</button>
    </form>
  </header>
  <main class="scene" id="scene"><div class="note"><h2>Buscando la última partida…</h2></div></main>
  <section class="scene" id="clanView" hidden></section>
</div>

<script>
(() => {
  const API = 'https://data.aoe2companion.com/api';
  const WS  = 'wss://socket.aoe2companion.com/listen';
  const LANG = 'es';
  const DEFAULT_ID = '2575121';
  const DEFAULT_CLAN = 'TRSGS';
  const POLL_MS = 30000;
  const HISTORY_CARDS = 2; // partidas anteriores que se muestran debajo de la principal
  const AOE_COLORS = {1:'#405BFF',2:'#FF0000',3:'#00FF00',4:'#FFFF00',5:'#00FFFF',6:'#FF57B3',7:'#797979',8:'#FF9600'};

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // La API puede devolver snake_case o camelCase: normalizamos todo a camelCase.
  const camel = o => Array.isArray(o) ? o.map(camel)
    : (o && typeof o === 'object') ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k.replace(/_([a-z0-9])/g, (_, c) => c.toUpperCase()), camel(v)]))
    : o;
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

  let profileId = new URLSearchParams(location.search).get('id') || store('aoe2-profile-id') || DEFAULT_ID;
  let socket, reconnectTimer, reconnectDelay = 2000, wsUp = false;
  const ongoing = new Map();
  let current = null; // { match, live, src }

  // ---------- helpers ----------
  const players = m => m.players ? m.players
    : (m.teams || []).flatMap(t => (t.players || []).map(p => ({ ...p, team: p.team ?? t.teamId })));
  const isMe = p => String(p.profileId) === String(profileId);
  const color = p => p.colorHex || AOE_COLORS[p.color] || null;

  function split(m) {
    const all = players(m);
    const me = all.find(isMe);
    const t = me?.team;
    const teams = t != null && t >= 0;
    const allies = teams ? all.filter(p => p !== me && p.team === t) : [];
    const rivals = all.filter(p => p !== me && !allies.includes(p));
    return { me, allies, rivals };
  }

  function clock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
  }
  function ago(d) {
    const min = Math.round((Date.now() - new Date(d)) / 60000);
    if (min < 1) return 'recién';
    if (min < 60) return `hace ${min} min`;
    const h = Math.round(min / 60);
    if (h < 48) return `hace ${h} h`;
    const days = Math.round(h / 24);
    if (days < 60) return `hace ${days} días`;
    const months = Math.round(days / 30);
    return months < 24 ? `hace ${months} meses` : `hace ${Math.round(days / 365)} años`;
  }
  const stillRunning = m => !m.finished && !m.abandoned && (Date.now() - new Date(m.started)) < 3 * 3600e3;

  let view = 'rival';
  const statuses = { rival: 'connecting', clan: 'connecting' };
  function paintStatus() {
    const kind = statuses[view];
    $('#dot').className = 'dot ' + (kind === 'live' ? 'live' : kind === 'off' ? 'off' : '');
    $('#statusText').textContent =
      kind === 'live' ? 'En vivo' :
      kind === 'off'  ? (view === 'rival' ? `Sin conexión en vivo, consultando cada ${POLL_MS / 1000} s` : 'Sin conexión en vivo, reintentando…') :
                        'Conectando…';
  }
  function setStatus(kind) { statuses.rival = kind; paintStatus(); }
  function setClanStatus(kind) { statuses.clan = kind; paintStatus(); }
  const baseTitle = () => view === 'clan' ? `Clan ${clan.tag}` : 'Rival AoE2';

  // ---------- ELO de RM 1v1 (se busca en el perfil de cada jugador) ----------
  const profiles = new Map(); // profileId -> { at, data, loading }
  const PROFILE_TTL = 10 * 60e3;
  const isRm1v1 = l => ['rm_1v1', 3, '3'].includes(l.leaderboardId) || /^rm 1v1$/i.test(l.abbreviation || '');
  const isRmTeam = l => ['rm_team', 4, '4'].includes(l.leaderboardId) || /^rm team$/i.test(l.abbreviation || '');
  const rm1v1 = id => {
    const d = profiles.get(String(id))?.data;
    return d === undefined ? undefined : (d.rm1v1 || { none: true });
  };

  function loadProfiles(ids) {
    const need = ids.filter(id => {
      const c = profiles.get(String(id));
      return !c || (!c.loading && Date.now() - c.at > PROFILE_TTL);
    });
    if (!need.length) return;
    Promise.allSettled(need.map(id => {
      const entry = { at: Date.now(), data: profiles.get(String(id))?.data, loading: true };
      profiles.set(String(id), entry);
      return fetch(`${API}/profiles/${encodeURIComponent(id)}?language=${LANG}&exclude=ratings`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
        .then(j => {
          const lbs = camel(j).leaderboards || [];
          const pick = test => {
            const lb = lbs.find(test);
            return lb ? { rating: lb.rating, max: lb.maxRating, wins: lb.wins ?? 0, losses: lb.losses ?? 0, rank: lb.rank, total: lb.total, streak: lb.streak, active: lb.active, last: lb.lastMatchTime } : null;
          };
          entry.data = { rm1v1: pick(isRm1v1), team: pick(isRmTeam) };
        })
        .catch(() => { entry.at = Date.now() - PROFILE_TTL + 60e3; }) // si falla, reintenta en 1 min
        .finally(() => { entry.loading = false; });
    })).then(() => {
      if (current) render(current.match, current.live, current.src);
      if (clan.loaded) renderClan();
    });
  }

  // ---------- render ----------
  const is1v1Match = m => m.leaderboardId === 'rm_1v1' || m.leaderboardId === 3;
  // El nombre de un jugador lleva a su partida acá mismo (ver peek).
  const playerLink = (id, html) => `<a href="?id=${esc(encodeURIComponent(id))}#rival" data-player="${esc(id)}">${html}</a>`;

  // ---------- duelos: cada equipo ordenado por rating, el más fuerte contra el más fuerte ----------
  let ratingMode = store('aoe2-rating') === 'tg' ? 'tg' : '1v1';
  const fmtN = x => Number(x).toLocaleString(LANG, { useGrouping: 'always' });
  const sgn = d => d > 0 ? '+' + d : d < 0 ? '−' + -d : '0';
  const CROWN = '<svg class="crown" viewBox="0 0 24 24" role="img" aria-label="MVP"><path d="M3 19 2 7l5 4 5-7 5 7 5-4-1 12Z" fill="currentColor"/></svg>';

  // Rating a mostrar: un número, null si el jugador no tiene, o undefined si todavía se está cargando.
  function ratingFor(p, m) {
    if (ratingMode === '1v1') {
      const d = rm1v1(p.profileId);
      if (d === undefined) return is1v1Match(m) && p.rating != null ? p.rating : undefined;
      return d.rating ?? null;
    }
    if (!is1v1Match(m) && p.rating != null) return p.rating; // el que tenía en esa partida
    const d = profiles.get(String(p.profileId))?.data;
    return d === undefined ? undefined : (d.team?.rating ?? null);
  }

  // Score y eAPM: la API de aoe2companion no los trae hoy (los nombres de abajo son una suposición). Si algún día
  // vienen en el jugador se muestran solos, y el de mayor score de la partida lleva la corona de MVP.
  const numOrNull = v => v == null || v === '' || !Number.isFinite(Number(v)) ? null : Number(v);
  const statsOf = p => ({
    score: numOrNull(p.score ?? p.stats?.score),
    eapm: numOrNull(p.eapm ?? p.stats?.eapm ?? p.apm ?? p.stats?.apm),
  });

  const rankSide = (ps, m) => ps
    .map(p => ({ p, v: ratingFor(p, m), st: statsOf(p) }))
    .sort((a, b) => (b.v ?? -1) - (a.v ?? -1));
  const mean = xs => {
    const v = xs.map(x => x.v).filter(x => typeof x === 'number');
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  };

  function idCell(x, side, top) {
    if (!x) return `<div class="d-id d-${side}"></div>`;
    const p = x.p, pc = color(p);
    const img = p.civImageUrl ? `<img class="d-civ" src="${esc(p.civImageUrl)}" alt="">` : '<span class="d-civ"></span>';
    const label = esc(p.name || 'Jugador ' + p.profileId);
    const name = isMe(p) ? `<span class="d-name me">${label}</span>` : `<span class="d-name">${playerLink(p.profileId, label)}</span>`;
    const mvp = top && top.p === p ? CROWN : '';
    const sub = [p.civName || p.civ, x.st.score != null ? `${fmtN(x.st.score)} pts` : '', x.st.eapm != null ? `${Math.round(x.st.eapm)} eAPM` : '']
      .filter(Boolean).join(' · ');
    return `<div class="d-id d-${side}"${pc ? ` style="--pc:${esc(pc)}"` : ''}>
      <div class="d-top">${side === 'l' ? img + name + mvp : mvp + name + img}</div>
      <div class="d-sub">${esc(sub)}</div>
    </div>`;
  }

  function barCell(x, side, pct) {
    if (!x) return `<div class="d-track d-${side}"></div>`;
    const ok = typeof x.v === 'number';
    return `<div class="d-track d-${side}"><div class="d-bar${ok ? '' : ' na'}" style="width:${ok ? pct(x.v).toFixed(1) : 0}%">${ok ? x.v : x.v === undefined ? '…' : '—'}</div></div>`;
  }

  const chipHtml = d => d == null ? '' : `<span class="dchip ${d >= 0 ? 'pos' : 'neg'}">${sgn(d)}</span>`;

  function matchHead(m, live, label) {
    const { me } = split(m);
    const mode = m.leaderboardName || m.gameModeName || 'Partida';
    const chip = live ? '<span class="chip live">Jugando ahora</span>'
      : me?.won === true ? '<span class="chip win">Victoria</span>'
      : me?.won === false ? '<span class="chip loss">Derrota</span>'
      : '<span class="chip none">Sin resultado</span>';
    const time = live
      ? `<span><span id="elapsed">${clock(Date.now() - new Date(m.started))}</span> desde que arrancó</span>`
      : m.finished ? `<span>${clock(new Date(m.finished) - new Date(m.started))} de partida, terminó ${ago(m.finished)}</span>`
      : `<span>empezó ${ago(m.started)}</span>`;
    const action = live
      ? `<a class="live" href="aoe2de://1/${esc(m.matchId)}" title="Abre el juego para mirarla como espectador">${EYE}Ver en el juego</a>`
      : recLink(m, label);
    return `<div class="mhead">
      ${m.mapImageUrl ? `<img class="mapimg" src="${esc(m.mapImageUrl)}" alt="">` : '<div class="mapimg"></div>'}
      <div class="mtitle">
        <h2 class="mapname">${esc(m.mapName || m.map || 'Mapa desconocido')}</h2>
        <div class="modes"><span>${esc(mode)}</span>${live && m.server ? `<span>Servidor ${esc(m.server)}</span>` : ''}${time}</div>
      </div>
      ${chip}${action}
    </div>`;
  }

  // entries: [{ m, live }]. Todas las tarjetas comparten la misma escala de barras, así se pueden comparar entre sí.
  function duelCards(entries) {
    const sides = entries.map(({ m }) => {
      const { me, allies, rivals } = split(m);
      return { L: rankSide([me, ...allies].filter(Boolean), m), R: rankSide(rivals, m) };
    });
    const vals = sides.flatMap(s => [...s.L, ...s.R]).map(x => x.v).filter(v => typeof v === 'number');
    const lo = vals.length ? Math.floor((Math.min(...vals) - 150) / 50) * 50 : 0;
    const hi = vals.length ? Math.ceil(Math.max(...vals) / 50) * 50 : 1;
    const pct = v => Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo)));

    return entries.map(({ m, live }, i) => {
      const { L, R } = sides[i];
      const scored = [...L, ...R].filter(x => x.st.score != null);
      const top = scored.length ? scored.reduce((a, b) => b.st.score > a.st.score ? b : a) : null;
      const aL = mean(L), aR = mean(R);
      const avg = aL != null && aR != null
        ? `<div class="d-avg"><span class="sp"></span><span class="a l">${Math.round(aL)}</span><span class="d-vs">${chipHtml(Math.round(aL - aR))}</span><span class="a r">${Math.round(aR)}</span><span class="sp"></span></div>`
        : '';
      let rows = '';
      for (let k = 0; k < Math.max(L.length, R.length); k++) {
        const a = L[k], b = R[k];
        const d = a && b && typeof a.v === 'number' && typeof b.v === 'number' ? a.v - b.v : null;
        rows += `<div class="d-row">
          ${idCell(a, 'l', top)}${barCell(a, 'l', pct)}<div class="d-vs">${chipHtml(d)}</div>${barCell(b, 'r', pct)}${idCell(b, 'r', top)}
        </div>`;
      }
      return `<article class="match">
        ${matchHead(m, live, i === 0 ? 'Descargar rec' : 'rec')}
        <div class="duel"><div class="dgrid">${avg}${rows}</div></div>
      </article>`;
    }).join('');
  }

  let picking = false; // mostrando resultados de búsqueda
  function render(m, live, src) {
    if (picking) return;
    const isNew = !current || current.match.matchId !== m.matchId || (live && !current.live);
    if (live && isNew && current) chime(); // arrancó una partida del jugador que ya se estaba mirando
    current = { match: m, live, src };
    const { rivals } = split(m);
    // Las partidas anteriores se muestran con el mismo formato de duelo.
    const older = hist.id === profileId ? hist.matches.filter(x => x.matchId !== m.matchId).slice(0, HISTORY_CARDS) : [];
    loadProfiles([...new Set([m, ...older].flatMap(x => players(x).map(p => p.profileId)))]);

    $('#scene').className = 'scene ' + (live ? 'live' : 'past');
    $('#scene').innerHTML = `<div class="duels ${isNew && live ? 'enter' : ''}">${duelCards([{ m, live }, ...older.map(x => ({ m: x, live: false }))])}</div>`;

    document.title = live && rivals.length
      ? `⚔ ${rivals.map(p => `${p.name} (${rm1v1(p.profileId)?.rating ?? p.rating ?? '?'})`).join(', ')}`
      : baseTitle();
  }

  function renderNote(title, html) {
    current = null;
    $('#scene').className = 'scene';
    $('#scene').innerHTML = `<div class="note"><h2>${title}</h2>${html}</div>`;
  }

  setInterval(() => {
    const el = document.getElementById('elapsed');
    if (el && current?.live) el.textContent = clock(Date.now() - new Date(current.match.started));
  }, 1000);

  // ---------- aviso con sonido cuando arranca una partida ----------
  let soundOn = store('aoe2-sound') === '1', audio = null;
  function chime() {
    if (!soundOn) return;
    try {
      audio = audio || new AudioContext();
      const asked = Date.now();
      // Sin un toque previo en la página el navegador no deja sonar; si lo habilita más tarde, ese aviso ya pasó.
      audio.resume().then(() => {
        if (Date.now() - asked > 2000) return;
        const t0 = audio.currentTime;
        [0, .35].forEach(d => [[880, .25], [2430, .08]].forEach(([f, v]) => { // dos golpes de campana
          const o = audio.createOscillator(), g = audio.createGain(), t = t0 + d;
          o.frequency.value = f;
          g.gain.setValueAtTime(v, t);
          g.gain.exponentialRampToValueAtTime(.001, t + 1.2);
          o.connect(g).connect(audio.destination);
          o.start(t); o.stop(t + 1.2);
        }));
      }, () => {});
    } catch {}
  }
  const paintBell = () => $('#bell').setAttribute('aria-pressed', soundOn);
  $('#bell').addEventListener('click', () => {
    soundOn = !soundOn;
    store('aoe2-sound', soundOn ? '1' : '0');
    paintBell();
    chime(); // al activarlo suena una vez, así se sabe que anda
  });
  paintBell();

  // ---------- rating a comparar: 1v1 o Team Game ----------
  const paintSeg = () => document.querySelectorAll('#ratingSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === ratingMode));
  $('#ratingSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (!b || b.dataset.mode === ratingMode) return;
    ratingMode = b.dataset.mode;
    store('aoe2-rating', ratingMode);
    paintSeg();
    if (current) render(current.match, current.live, current.src);
  });
  paintSeg();

  // ---------- REST: última partida (y respaldo si el websocket falla) ----------
  async function loadLast() {
    if (picking) return;
    try {
      const url = `${API}/matches?profile_ids=${encodeURIComponent(profileId)}&use_enums=true&page=1&per_page=1&language=${LANG}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const m = camel(await r.json()).matches?.[0];
      if (m) loadHistory(m);
      if (current?.live && current.src === 'ws') return; // el socket manda mientras hay partida en vivo
      if (!m) return renderNote('Sin partidas', '<p>No hay partidas registradas para ese Profile ID. Revisá el número.</p>');
      render(m, stillRunning(m), 'rest');
    } catch (e) {
      if (!current && window.top !== window.self) return renderNote('Abrilo fuera de esta vista previa',
        `<p>Esta vista previa bloquea las conexiones a APIs externas.</p>
         <p>Descargá el archivo y abrilo con doble clic en Chrome, Edge o Firefox.</p>`);
      if (!current) renderNote('No pude leer la API de aoe2companion',
        `<p>Detalle: ${esc(e.message)}.</p>
         <p>Si abriste el archivo con doble clic y el navegador bloquea las consultas, servilo desde un servidor local:
         en esta carpeta corré <code>php -S localhost:8080</code> y abrí <code>http://localhost:8080/</code>.</p>`);
    }
  }

  // ---------- historial: partidas anteriores del jugador seguido ----------
  // Se pide al abrir y cuando termina una partida, no en cada sondeo, para no cargar la API.
  let hist = { id: null, key: '', matches: [] };
  async function loadHistory(last) {
    const id = profileId, key = `${last.matchId}:${last.finished || ''}`;
    if (hist.id === id && hist.key === key) return;
    hist = { id, key, matches: hist.id === id ? hist.matches : [] };
    try {
      const res = await getJson(`${API}/matches?profile_ids=${encodeURIComponent(id)}&use_enums=true&page=1&per_page=10&language=${LANG}`);
      if (id !== profileId || hist.key !== key) return; // cambiaron de jugador o ya se pidió uno más nuevo
      hist.matches = res.matches || [];
      if (current) render(current.match, current.live, current.src);
    } catch { if (hist.key === key) hist.key = ''; } // si falla, reintenta con el próximo sondeo
  }


  // ---------- grabaciones (recs) de las partidas terminadas ----------
  // Microsoft guarda unos meses la grabación de cada jugador. aoe.ms/replay redirige a esta dirección, pero la
  // redirección no deja leer la respuesta desde otra página; pidiéndola directo, si ya no está se avisa acá mismo.
  const recUrl = (matchId, pid) => `https://api.ageofempires.com/api/GameStats/AgeII/GetMatchReplay/?gameId=${encodeURIComponent(matchId)}&profileId=${encodeURIComponent(pid)}&matchId=${encodeURIComponent(matchId)}`;
  const DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
  const recs = new Map(); // matchId -> 'loading' | 'missing' | 'error'
  function recLink(m, label) {
    if (m.recordGame === false) return '';
    const s = recs.get(String(m.matchId));
    const txt = s === 'loading' ? 'Descargando…' : s === 'missing' ? 'No disponible' : s === 'error' ? 'No se pudo descargar' : label;
    const tip = s === 'missing' ? 'Microsoft ya no la tiene, o todavía no se subió. Tocá para reintentar.'
      : 'Grabación de la partida: un .zip con el archivo .aoe2record. Microsoft la guarda unos meses.';
    return `<a class="rec${s === 'missing' || s === 'error' ? ' off' : ''}" href="${esc(recUrl(m.matchId, profileId))}" data-rec="${esc(m.matchId)}" title="${tip}">${DOWNLOAD}${txt}</a>`;
  }

  // Primero la del jugador seguido; si no está, la de otro jugador de la partida, que la grabó igual.
  async function downloadRec(id) {
    const m = [current?.match, ...hist.matches].find(x => x && String(x.matchId) === id);
    if (!m || recs.get(id) === 'loading') return;
    recs.set(id, 'loading');
    repaint();
    let state = 'missing';
    try {
      for (const pid of new Set([profileId, ...players(m).map(p => String(p.profileId))])) {
        const r = await fetch(recUrl(id, pid));
        if (r.status === 404) continue;
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(await r.blob()), download: `AgeIIDE_Replay_${id}.zip` });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 60e3);
        state = null;
        break;
      }
    } catch { state = 'error'; }
    if (state) recs.set(id, state); else recs.delete(id);
    repaint();
  }
  const repaint = () => { if (current) render(current.match, current.live, current.src); };

  // ---------- WebSocket: partidas en curso en tiempo real ----------
  function pickLive() {
    const mine = [...ongoing.values()].filter(m => players(m).some(isMe))
      .sort((a, b) => new Date(b.started) - new Date(a.started));
    if (mine[0]) render(mine[0], true, 'ws');
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (socket) { socket.onclose = null; socket.close(); }
    ongoing.clear();
    wsUp = false;
    setStatus('connecting');
    try {
      socket = new WebSocket(`${WS}?handler=ongoing-matches&profile_ids=${encodeURIComponent(profileId)}&language=${LANG}`);
    } catch { return retry(); }
    socket.onopen = () => { wsUp = true; reconnectDelay = 2000; setStatus('live'); };
    socket.onmessage = ev => {
      let msg;
      try { msg = camel(JSON.parse(ev.data)); } catch { return; }
      if (!Array.isArray(msg)) return; // pong u otros mensajes de control
      for (const e of msg) {
        const id = e.data?.matchId;
        if (id == null) continue;
        if (e.type === 'matchAdded') ongoing.set(id, e.data);
        else if (e.type === 'matchUpdated') ongoing.set(id, { ...ongoing.get(id), ...e.data });
        else if (e.type === 'matchRemoved') {
          const ended = ongoing.get(id);
          ongoing.delete(id);
          if (ended && current?.live && current.match.matchId === id) {
            render({ ...ended, finished: new Date().toISOString() }, false, 'ws');
            setTimeout(loadLast, 10000); // damos tiempo a que se registre el resultado
          }
        }
      }
      pickLive();
    };
    socket.onclose = () => { wsUp = false; setStatus('off'); retry(); };
  }
  function retry() {
    setStatus('off');
    reconnectTimer = setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 60000);
  }

  setInterval(() => { if (!(current?.live && current.src === 'ws' && wsUp)) loadLast(); }, POLL_MS);

  // ---------- perfil ----------
  let peeking = false; // siguiendo a alguien abierto con un clic, sin cambiar el guardado (ver peek)
  function follow(id, save = true) {
    picking = false;
    peeking = !save;
    profileId = String(id).trim();
    if (save) store('aoe2-profile-id', profileId);
    $('#pid').value = profileId;
    // La marca de vistazo queda en el historial para que recargar tampoco pise el jugador guardado.
    try { history.replaceState(peeking ? { peek: true } : null, '', '?id=' + encodeURIComponent(profileId) + location.hash); } catch {}
    current = null;
    renderNote('Buscando la última partida…', '');
    connect();
    loadLast();
  }
  $('#who').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#pid').value.trim();
    if (!v) return;
    if (/^\d+$/.test(v)) follow(v);
    else searchPlayers(v);
  });

  // ---------- búsqueda por nombre ----------
  async function searchPlayers(q) {
    if (q.length < 3) {
      picking = true;
      return showPick(q, null, 'Escribí al menos 3 letras del nombre.');
    }
    picking = true;
    $('#scene').className = 'scene';
    $('#scene').innerHTML = `<div class="note"><h2>Buscando “${esc(q)}”…</h2></div>`;
    try {
      const res = await getJson(`${API}/profiles?search=${encodeURIComponent(q)}&per_page=20&page=1&language=${LANG}`);
      if (!picking) return; // se eligió otro jugador mientras buscaba
      const lower = q.toLowerCase();
      const list = (res.profiles || []).sort((a, b) =>
        ((String(b.name).toLowerCase() === lower) - (String(a.name).toLowerCase() === lower)) ||
        ((Number(b.games) || 0) - (Number(a.games) || 0)));
      if (list.length === 1) return follow(list[0].profileId);
      showPick(q, list);
    } catch (e) {
      if (picking) showPick(q, null, `No pude buscar: ${e.message}.`);
    }
  }

  function showPick(q, list, msg) {
    $('#scene').className = 'scene';
    const back = '<p><button type="button" class="linkbtn" data-cancel>Volver al jugador anterior</button></p>';
    if (msg || !list?.length) {
      $('#scene').innerHTML = `<div class="note"><h2>${list ? `Sin resultados para “${esc(q)}”` : 'Búsqueda'}</h2><p>${esc(msg || 'Probá con otra parte del nombre o con el profile ID.')}</p>${back}</div>`;
      return;
    }
    $('#scene').innerHTML = `<div class="note">
      <h2>Resultados para “${esc(q)}”</h2>
      <p>Elegí el jugador a seguir.</p>
      <ul class="picklist">${list.map(p => `<li><button type="button" data-pick="${esc(p.profileId)}">
        ${flagImg((p.country || '').toLowerCase())}<strong>${esc(p.name)}</strong><span class="pid">(${esc(p.profileId)})</span>
        <span class="meta">${p.games != null ? `${Number(p.games)} partidas` : 'sin partidas'}${p.clan ? `, clan ${esc(p.clan)}` : ''}</span>
      </button></li>`).join('')}</ul>
      ${back}
    </div>`;
  }

  $('#scene').addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if (pick) return follow(pick.dataset.pick);
    if (e.target.closest('[data-cancel]')) follow(profileId, !peeking);
    const rec = e.target.closest('a[data-rec]');
    // Con Ctrl, Shift o la ruedita se abre como cualquier link y la descarga el navegador.
    if (rec && !(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey)) { e.preventDefault(); downloadRec(rec.dataset.rec); }
  });

  // ---------- CLAN ----------
  const clan = {
    tag: new URLSearchParams(location.search).get('clan') || store('aoe2-clan') || DEFAULT_CLAN,
    members: [], lb1: new Map(), lbt: new Map(), ongoing: new Map(),
    loaded: false, loading: false, error: null, sort: 'status',
    socket: null, socketKey: '', socketUp: false, retryTimer: null, delay: 2000,
  };
  const EYE = '<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const flagImg = cc => cc ? `<img class="flag" src="https://flagcdn.com/w40/${esc(cc)}.png" alt="" onerror="this.remove()">` : '';

  async function getJson(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return camel(await r.json());
  }

  async function loadClan() {
    const tag = clan.tag;
    clan.loading = true;
    try {
      const q = `clan=${encodeURIComponent(tag)}&per_page=100&page=1&language=${LANG}`;
      const [mem, l1, lt] = await Promise.all([
        getJson(`${API}/profiles?${q}`),
        getJson(`${API}/leaderboards/rm_1v1?${q}`).catch(() => null),
        getJson(`${API}/leaderboards/rm_team?${q}`).catch(() => null),
      ]);
      if (tag !== clan.tag) return; // cambiaron el clan mientras cargaba
      clan.members = mem.profiles || [];
      clan.lb1 = new Map((l1?.players || []).map(p => [String(p.profileId), p]));
      clan.lbt = new Map((lt?.players || []).map(p => [String(p.profileId), p]));
      clan.error = null;
      clan.loaded = true;
      // Los que no aparecen en ningún leaderboard del clan se consultan de a uno.
      loadProfiles(clan.members.map(m => m.profileId).filter(id => !clan.lb1.has(String(id)) && !clan.lbt.has(String(id))));
      connectClan();
    } catch (e) {
      if (tag === clan.tag) clan.error = e.message;
    } finally {
      if (tag === clan.tag) { clan.loading = false; renderClan(); }
    }
  }

  function memberInfo(mem) {
    const id = String(mem.profileId);
    const a = clan.lb1.get(id), b = clan.lbt.get(id);
    const entry = profiles.get(id), d = entry?.data;
    const pending = !a && !b && (!entry || (entry.loading && !d));
    const lasts = [a?.lastMatchTime, b?.lastMatchTime, d?.rm1v1?.last, d?.team?.last].filter(Boolean).map(t => new Date(t));
    let match = null;
    for (const m of clan.ongoing.values()) {
      if (players(m).some(p => String(p.profileId) === id) && (!match || new Date(m.started) > new Date(match.started))) match = m;
    }
    return {
      mem, pending, match,
      r1: a?.rating ?? d?.rm1v1?.rating ?? null,
      rt: b?.rating ?? d?.team?.rating ?? null,
      last: lasts.length ? new Date(Math.max(...lasts)) : null,
    };
  }

  function statusHtml(r) {
    const m = r.match;
    if (!m) return `<span class="idle">${r.last ? 'Jugó ' + ago(r.last) : '—'}</span>`;
    const all = players(m);
    const me = all.find(p => String(p.profileId) === String(r.mem.profileId));
    const map = m.mapName || m.map || 'Partida';
    let txt;
    if (all.length === 2) {
      txt = `${map} vs ${all.find(p => p !== me)?.name ?? '?'}`;
    } else {
      const sizes = Object.values(all.reduce((acc, p) => (p.team != null && p.team >= 0 && (acc[p.team] = (acc[p.team] || 0) + 1), acc), {}));
      txt = sizes.length === 2 ? `${map} ${sizes[0]}v${sizes[1]}` : `${map}, ${all.length} jugadores`;
      const clanIds = new Set(clan.members.map(x => String(x.profileId)));
      const mates = all.filter(p => p !== me && me && p.team === me.team && clanIds.has(String(p.profileId))).map(p => p.name);
      if (mates.length) txt += ` con ${mates.join(', ')}`;
    }
    return `<a class="live" href="aoe2de://1/${esc(m.matchId)}" title="Ver la partida en el juego">${EYE}${esc(txt)}</a>`;
  }

  function renderClan() {
    const el = $('#clanView');
    if (!clan.loaded) {
      el.innerHTML = clan.error
        ? `<div class="note"><h2>No pude cargar el clan ${esc(clan.tag)}</h2><p>Detalle: ${esc(clan.error)}.</p></div>`
        : `<div class="note"><h2>Cargando el clan ${esc(clan.tag)}…</h2></div>`;
      return;
    }
    if (!clan.members.length) {
      el.innerHTML = `<div class="note"><h2>Sin integrantes</h2><p>No encontramos a nadie en el clan <strong>${esc(clan.tag)}</strong>. Tiene que ser el tag del clan oficial del juego, escrito igual que en el juego.</p></div>`;
      return;
    }
    const num = (x, k) => x[k] ?? -1;
    const rows = clan.members.map(memberInfo).sort((a, b) =>
      clan.sort === 'name'   ? String(a.mem.name).localeCompare(String(b.mem.name), 'es', { sensitivity: 'base' }) :
      clan.sort === 'status' ? (!!b.match - !!a.match) || ((b.last || 0) - (a.last || 0)) :
      clan.sort === 'rt'     ? (num(b, 'rt') - num(a, 'rt')) || (num(b, 'r1') - num(a, 'r1')) :
                               (num(b, 'r1') - num(a, 'r1')) || (num(b, 'rt') - num(a, 'rt')));
    const playing = rows.filter(r => r.match).length;
    const th = (key, label, cls = '') =>
      `<th class="${cls}" scope="col"><button type="button" data-sort="${key}" aria-pressed="${clan.sort === key}">${label}${clan.sort === key ? ' ▾' : ''}</button></th>`;
    const cell = (v, r) => v ?? (r.pending ? '…' : '—');
    el.innerHTML = `
      <div class="clanhead">
        <h2 class="clanname">${esc(clan.tag)}</h2>
        <div class="modes"><span>${rows.length} integrantes</span><span class="${playing ? 'playing' : ''}">${playing ? `${playing} jugando ahora` : 'Nadie jugando ahora'}</span></div>
      </div>
      <div class="tablewrap"><table class="clan">
        <thead><tr>${th('r1', '1v1', 'num')}${th('rt', 'TG', 'num')}${th('name', 'Jugador')}${th('status', 'Estado', 'st')}</tr></thead>
        <tbody>${rows.map(r => {
          const cc = (r.mem.country || '').toLowerCase();
          const you = String(r.mem.profileId) === String(profileId);
          return `<tr class="${you ? 'you' : ''}">
            <td class="num r1">${cell(r.r1, r)}</td>
            <td class="num rt">${cell(r.rt, r)}</td>
            <td class="who">${flagImg(cc)}${playerLink(r.mem.profileId, esc(r.mem.name))} <span class="pid">(<a href="https://www.aoe2companion.com/profile/${esc(r.mem.profileId)}" target="_blank" rel="noopener" title="Perfil en aoe2companion">${esc(r.mem.profileId)}</a>)</span><div class="st-m">${statusHtml(r)}</div></td>
            <td class="st">${statusHtml(r)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;
    if (view === 'clan' && !(current?.live)) document.title = baseTitle();
  }

  $('#clanView').addEventListener('click', e => {
    const b = e.target.closest('[data-sort]');
    if (b) { clan.sort = b.dataset.sort; renderClan(); }
  });

  function connectClan() {
    const ids = clan.members.map(m => m.profileId).join(',');
    if (clan.socket && clan.socketKey === ids && clan.socketUp) return;
    clearTimeout(clan.retryTimer);
    if (clan.socket) { clan.socket.onclose = null; clan.socket.close(); clan.socket = null; }
    clan.ongoing.clear();
    clan.socketKey = ids;
    clan.socketUp = false;
    if (!ids) return;
    setClanStatus('connecting');
    let ws;
    try {
      ws = new WebSocket(`${WS}?handler=ongoing-matches&profile_ids=${encodeURIComponent(ids)}&language=${LANG}`);
    } catch { return retryClan(); }
    clan.socket = ws;
    ws.onopen = () => { clan.socketUp = true; clan.delay = 2000; setClanStatus('live'); };
    ws.onmessage = ev => {
      let msg;
      try { msg = camel(JSON.parse(ev.data)); } catch { return; }
      if (!Array.isArray(msg)) return;
      for (const e of msg) {
        const id = e.data?.matchId;
        if (id == null) continue;
        if (e.type === 'matchAdded') clan.ongoing.set(id, e.data);
        else if (e.type === 'matchUpdated') clan.ongoing.set(id, { ...clan.ongoing.get(id), ...e.data });
        else if (e.type === 'matchRemoved') clan.ongoing.delete(id);
      }
      renderClan();
    };
    ws.onclose = () => { clan.socketUp = false; retryClan(); };
  }
  function retryClan() {
    setClanStatus('off');
    clan.retryTimer = setTimeout(connectClan, clan.delay);
    clan.delay = Math.min(clan.delay * 2, 60000);
  }

  function openClan(tag) {
    clan.tag = String(tag).trim();
    store('aoe2-clan', clan.tag);
    $('#tag').value = clan.tag;
    clan.loaded = false;
    clan.members = [];
    clan.error = null;
    if (clan.socket) { clan.socket.onclose = null; clan.socket.close(); clan.socket = null; }
    clearTimeout(clan.retryTimer);
    clan.ongoing.clear();
    clan.socketKey = '';
    setClanStatus('connecting');
    renderClan();
    loadClan();
  }
  $('#clanForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#tag').value.trim();
    if (v) openClan(v);
  });

  // Ratings y "hace X" se refrescan solos mientras la sección está abierta.
  setInterval(() => { if (view === 'clan' && clan.loaded && !clan.loading) loadClan(); }, 5 * 60e3);
  setInterval(() => { if (view === 'clan' && clan.loaded) renderClan(); }, 60e3);

  // ---------- secciones ----------
  function show(v) {
    view = v === 'clan' ? 'clan' : 'rival';
    $('#scene').hidden = view !== 'rival';
    $('#who').hidden = view !== 'rival';
    $('#ratingSeg').hidden = view !== 'rival';
    $('#clanView').hidden = view !== 'clan';
    $('#clanForm').hidden = view !== 'clan';
    document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.view === view ? 'page' : 'false'));
    paintStatus();
    if (view === 'clan') {
      $('#tag').value = clan.tag;
      if (!clan.loaded && !clan.loading) openClan(clan.tag);
      else renderClan();
    } else if (!(current?.live)) document.title = baseTitle();
  }
  window.addEventListener('hashchange', () => {
    // Cambiar de sección crea otra entrada en el historial: si era un vistazo, la marca pasa a la nueva.
    if (peeking && !history.state?.peek) try { history.replaceState({ peek: true }, ''); } catch {}
    show(location.hash.slice(1));
  });

  // ---------- navegación entre jugadores ----------
  // Tocar a un jugador (su nombre o su tarjeta) abre su partida acá mismo. Es un vistazo: deja una entrada en el
  // historial para volver con Atrás y no cambia el jugador guardado (eso se hace desde el buscador).
  function peek(id) {
    id = String(id);
    if (id === profileId) { location.hash = 'rival'; return; } // ya es el seguido: solo mostrar su partida
    try { history.pushState({ peek: true }, '', '?id=' + encodeURIComponent(id) + '#rival'); } catch {}
    follow(id, false);
    show('rival');
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-player]');
    // Con Ctrl, Shift o la ruedita se abre como cualquier link, en otra pestaña o ventana.
    if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    peek(a.dataset.player);
  });
  window.addEventListener('popstate', () => {
    const id = new URLSearchParams(location.search).get('id');
    if (id && id !== profileId) follow(id, !history.state?.peek);
    show(location.hash.slice(1)); // si además cambia el ?id=, el navegador no dispara hashchange
  });

  follow(profileId, !history.state?.peek); // al recargar un vistazo, el jugador guardado no cambia
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
