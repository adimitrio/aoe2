<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rival AoE2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#232B35; --stone-2:#2C3643; --line:#3A4654;
    --bone:#ECE6D8; --ash:#9BA5B0; --gold:#D4AF52; --win:#6FBF73; --loss:#E0685C;
    --display:"Alegreya SC", Georgia, "Times New Roman", serif;
    --body:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;min-height:100%}
  body{background:var(--stone);color:var(--bone);font:17px/1.45 var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:18px 24px 40px}
  a{color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .status{display:flex;align-items:center;gap:8px;color:var(--ash);font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ash);flex:none}
  .dot.live{background:var(--win);animation:pulse 2s infinite}
  .dot.off{background:var(--loss)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,191,115,.55)}70%,100%{box-shadow:0 0 0 8px rgba(111,191,115,0)}}
  .left{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap}
  .tabs{display:flex;gap:3px;background:var(--stone-2);padding:3px;border-radius:8px}
  .tabs a{color:var(--ash);text-decoration:none;font-weight:700;font-size:15px;padding:5px 14px;border-radius:6px}
  .tabs a[aria-current="page"]{background:var(--stone);color:var(--bone)}
  form{display:flex;gap:8px;align-items:center}
  label{color:var(--ash);font-size:15px}
  input{background:var(--stone-2);border:1px solid var(--line);color:var(--bone);font:inherit;padding:6px 10px;border-radius:6px;width:9em}
  button{background:var(--gold);color:#221c0c;border:0;font:700 15px var(--body);padding:8px 14px;border-radius:6px;cursor:pointer}

  .scene{margin-top:22px}
  .state{display:inline-block;font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;margin-bottom:14px}
  .state.live{background:rgba(111,191,115,.16);color:var(--win)}
  .state.past{background:var(--stone-2);color:var(--ash)}

  .head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
  .mapimg{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--stone-2)}
  .mapname{font:800 28px/1.1 var(--display);margin:0}
  .modes{display:flex;gap:4px 16px;flex-wrap:wrap;color:var(--ash);font-size:15px;margin-top:2px}
  .clock{text-align:right}
  .clock b{display:block;font:700 30px/1 var(--body);font-variant-numeric:tabular-nums}
  .clock span{color:var(--ash);font-size:14px}

  .rivals{display:grid;gap:8px;margin-top:18px}
  .rival{display:grid;grid-template-columns:6px 1fr;background:var(--stone-2);border-radius:8px;overflow:hidden}
  .band{background:var(--pc,var(--gold))}
  .inner{display:grid;grid-template-columns:40px 1fr auto;column-gap:14px;row-gap:1px;align-items:center;padding:10px 16px}
  .civimg{grid-row:1/span 2;width:40px;height:40px}
  .rival h1{font:800 26px/1.15 var(--display);margin:0;overflow-wrap:anywhere;min-width:0}
  .rivals.solo h1{font-size:34px}
  .elo{font:700 30px/1 var(--body);font-variant-numeric:tabular-nums;text-align:right}
  .rivals.solo .elo{font-size:38px}
  .elo small{font-size:13px;font-weight:500;color:var(--ash);margin-right:6px}
  .meta{display:flex;gap:2px 16px;flex-wrap:wrap;color:var(--ash);font-size:14px;min-width:0}
  .meta .civname{color:var(--bone);font-weight:500}
  .diff{font-size:14px;text-align:right;color:var(--ash);white-space:nowrap}
  .flag{height:12px;vertical-align:-1px;margin-right:5px;border-radius:2px}
  .up{color:var(--loss)} .down{color:var(--win)}
  .pid{font:400 13px var(--body);color:var(--ash);font-variant-numeric:tabular-nums;white-space:nowrap}

  .side{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--ash);font-size:15px;display:flex;flex-direction:column;gap:6px}
  .side strong{color:var(--bone);font-weight:500}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--pc,var(--ash));margin-right:7px}
  .result{font-weight:700}
  .result.win{color:var(--win)} .result.loss{color:var(--loss)}

  .past .rival{opacity:.82}
  .note{background:var(--stone-2);border-radius:10px;padding:20px 22px;max-width:70ch}
  .note h2{font:800 24px/1.2 var(--display);margin:0 0 8px}
  .note p{margin:6px 0;color:var(--ash)}
  code{background:var(--stone);padding:1px 6px;border-radius:4px;color:var(--bone)}

  .clanhead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 20px;flex-wrap:wrap}
  .clanname{font:800 30px/1.1 var(--display);margin:0}
  .modes .playing{color:var(--win);font-weight:700}
  .tablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:8px}
  table.clan{width:100%;border-collapse:collapse;font-size:16px}
  table.clan th{background:var(--stone-2);text-align:left;padding:0;white-space:nowrap}
  table.clan th button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 14px;font:700 15px var(--body);color:var(--ash)}
  table.clan th button[aria-pressed="true"]{color:var(--bone)}
  table.clan th button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  table.clan th.num button{text-align:right}
  table.clan td{padding:7px 14px;border-top:1px solid var(--line);white-space:nowrap}
  table.clan tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.r1{font-weight:700}
  td.rt{color:var(--ash)}
  td.who a{color:var(--bone);text-decoration:none;font-weight:700}
  td.who a:hover{text-decoration:underline}
  tr.you td:first-child{box-shadow:inset 3px 0 var(--gold)}
  a.live{color:var(--win);text-decoration:none;display:inline-flex;align-items:center;gap:7px;vertical-align:top}
  a.live:hover{text-decoration:underline}
  .eye{width:18px;height:18px;flex:none}
  .idle{color:var(--ash)}
  .st-m{display:none;font-size:14px;margin-top:2px}
  .st-m a.live{color:var(--win);font-weight:400}
  @media (max-width:640px){
    table.clan th.st, table.clan td.st{display:none}
    .st-m{display:block}
    table.clan td.who{white-space:normal}
    table.clan td, table.clan th button{padding-left:10px;padding-right:10px}
  }

  .enter{animation:enter .45s ease-out}
  @keyframes enter{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.dot.live,.enter{animation:none}}
  @media (max-width:560px){
    .wrap{padding:14px 16px 32px}
    .head{grid-template-columns:auto 1fr}
    .clock{grid-column:1/-1;text-align:left}
    .inner{grid-template-columns:32px 1fr auto;column-gap:10px;padding:10px 12px}
    .civimg{width:32px;height:32px}
    .rival h1,.rivals.solo h1{font-size:22px}
    .diff{grid-column:2/-1;grid-row:2;text-align:left}
    .meta{grid-column:2/-1;gap:0 12px;font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="left">
      <nav class="tabs" aria-label="Secciones">
        <a href="#rival" data-view="rival">Rival</a>
        <a href="#clan" data-view="clan">Clan</a>
      </nav>
      <div class="status" role="status"><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>
    </div>
    <form id="who">
      <label for="pid">Profile ID</label>
      <input id="pid" inputmode="numeric" autocomplete="off">
      <button type="submit">Seguir</button>
    </form>
    <form id="clanForm" hidden>
      <label for="tag">Clan</label>
      <input id="tag" autocomplete="off" spellcheck="false">
      <button type="submit">Ver</button>
    </form>
  </header>
  <main class="scene" id="scene"><div class="note"><h2>Buscando la última partida…</h2></div></main>
  <section class="scene" id="clanView" hidden></section>
</div>

<script>
(() => {
  const API = 'https://data.aoe2companion.com/api';
  const WS  = 'wss://socket.aoe2companion.com/listen';
  const LANG = 'es';
  const DEFAULT_ID = '2575121';
  const DEFAULT_CLAN = 'TRSGS';
  const POLL_MS = 30000;
  const AOE_COLORS = {1:'#405BFF',2:'#FF0000',3:'#00FF00',4:'#FFFF00',5:'#00FFFF',6:'#FF57B3',7:'#797979',8:'#FF9600'};

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // La API puede devolver snake_case o camelCase: normalizamos todo a camelCase.
  const camel = o => Array.isArray(o) ? o.map(camel)
    : (o && typeof o === 'object') ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k.replace(/_([a-z0-9])/g, (_, c) => c.toUpperCase()), camel(v)]))
    : o;
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

  let profileId = new URLSearchParams(location.search).get('id') || store('aoe2-profile-id') || DEFAULT_ID;
  let socket, reconnectTimer, reconnectDelay = 2000, wsUp = false;
  const ongoing = new Map();
  let current = null; // { match, live, src }

  // ---------- helpers ----------
  const players = m => m.players ? m.players
    : (m.teams || []).flatMap(t => (t.players || []).map(p => ({ ...p, team: p.team ?? t.teamId })));
  const isMe = p => String(p.profileId) === String(profileId);
  const color = p => p.colorHex || AOE_COLORS[p.color] || null;

  function split(m) {
    const all = players(m);
    const me = all.find(isMe);
    const t = me?.team;
    const teams = t != null && t >= 0;
    const allies = teams ? all.filter(p => p !== me && p.team === t) : [];
    const rivals = all.filter(p => p !== me && !allies.includes(p));
    return { me, allies, rivals };
  }

  function clock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
  }
  function ago(d) {
    const min = Math.round((Date.now() - new Date(d)) / 60000);
    if (min < 1) return 'recién';
    if (min < 60) return `hace ${min} min`;
    const h = Math.round(min / 60);
    if (h < 48) return `hace ${h} h`;
    const days = Math.round(h / 24);
    return days < 60 ? `hace ${days} días` : `hace ${Math.round(days / 30)} meses`;
  }
  const stillRunning = m => !m.finished && !m.abandoned && (Date.now() - new Date(m.started)) < 3 * 3600e3;

  let view = 'rival';
  const statuses = { rival: 'connecting', clan: 'connecting' };
  function paintStatus() {
    const kind = statuses[view];
    $('#dot').className = 'dot ' + (kind === 'live' ? 'live' : kind === 'off' ? 'off' : '');
    $('#statusText').textContent =
      kind === 'live' ? 'En vivo' :
      kind === 'off'  ? (view === 'rival' ? `Sin conexión en vivo, consultando cada ${POLL_MS / 1000} s` : 'Sin conexión en vivo, reintentando…') :
                        'Conectando…';
  }
  function setStatus(kind) { statuses.rival = kind; paintStatus(); }
  function setClanStatus(kind) { statuses.clan = kind; paintStatus(); }
  const baseTitle = () => view === 'clan' ? `Clan ${clan.tag}` : 'Rival AoE2';

  // ---------- ELO de RM 1v1 (se busca en el perfil de cada jugador) ----------
  const profiles = new Map(); // profileId -> { at, data, loading }
  const PROFILE_TTL = 10 * 60e3;
  const isRm1v1 = l => ['rm_1v1', 3, '3'].includes(l.leaderboardId) || /^rm 1v1$/i.test(l.abbreviation || '');
  const isRmTeam = l => ['rm_team', 4, '4'].includes(l.leaderboardId) || /^rm team$/i.test(l.abbreviation || '');
  const rm1v1 = id => {
    const d = profiles.get(String(id))?.data;
    return d === undefined ? undefined : (d.rm1v1 || { none: true });
  };

  function loadProfiles(ids) {
    const need = ids.filter(id => {
      const c = profiles.get(String(id));
      return !c || (!c.loading && Date.now() - c.at > PROFILE_TTL);
    });
    if (!need.length) return;
    Promise.allSettled(need.map(id => {
      const entry = { at: Date.now(), data: profiles.get(String(id))?.data, loading: true };
      profiles.set(String(id), entry);
      return fetch(`${API}/profiles/${encodeURIComponent(id)}?language=${LANG}&exclude=ratings`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
        .then(j => {
          const lbs = camel(j).leaderboards || [];
          const pick = test => {
            const lb = lbs.find(test);
            return lb ? { rating: lb.rating, max: lb.maxRating, wins: lb.wins ?? 0, losses: lb.losses ?? 0, rank: lb.rank, streak: lb.streak, last: lb.lastMatchTime } : null;
          };
          entry.data = { rm1v1: pick(isRm1v1), team: pick(isRmTeam) };
        })
        .catch(() => { entry.at = Date.now() - PROFILE_TTL + 60e3; }) // si falla, reintenta en 1 min
        .finally(() => { entry.loading = false; });
    })).then(() => {
      if (current) render(current.match, current.live, current.src);
      if (clan.loaded) renderClan();
    });
  }

  // ---------- render ----------
  const is1v1Match = m => m.leaderboardId === 'rm_1v1' || m.leaderboardId === 3;

  function rivalCard(p, me, m) {
    const d = rm1v1(p.profileId), mine = me && rm1v1(me.profileId);
    const elo = d?.rating ?? (d?.none ? '—' : '…');
    let diffTxt = d?.none ? 'sin RM 1v1' : 'RM 1v1';
    if (d?.rating != null && mine?.rating != null) {
      const diff = d.rating - mine.rating;
      diffTxt = diff > 0 ? `<span class="up">+${diff} vs ${esc(me.name)}</span>` : diff < 0 ? `<span class="down">−${-diff} vs ${esc(me.name)}</span>` : `igual que ${esc(me.name)}`;
    }
    const games = d ? (d.wins + d.losses) : 0;
    const cc = (p.country || '').toLowerCase();
    const pc = color(p);
    return `
      <article class="rival" ${pc ? `style="--pc:${esc(pc)}"` : ''}>
        <div class="band"></div>
        <div class="inner">
          ${p.civImageUrl ? `<img class="civimg" src="${esc(p.civImageUrl)}" alt="">` : '<span class="civimg"></span>'}
          <h1>${esc(p.name || 'Jugador ' + p.profileId)} <span class="pid">(${esc(p.profileId)})</span></h1>
          <div class="elo"><small>1v1</small>${elo}</div>
          <div class="meta">
            <span class="civname">${esc(p.civName || p.civ || '?')}</span>
            ${cc ? `<span><img class="flag" src="https://flagcdn.com/w40/${esc(cc)}.png" alt="" onerror="this.remove()">${esc(cc.toUpperCase())}</span>` : ''}
            ${games ? `<span>${Math.round(100 * d.wins / games)}% de ${games} en 1v1</span>` : ''}
            ${d?.max ? `<span>máx ${d.max}</span>` : ''}
            ${!is1v1Match(m) && p.rating != null ? `<span>esta partida ${p.rating}</span>` : ''}
            <a href="https://www.aoe2companion.com/profile/${esc(p.profileId)}" target="_blank" rel="noopener">companion</a>
            <a href="https://www.aoe2insights.com/user/${esc(p.profileId)}/" target="_blank" rel="noopener">insights</a>
          </div>
          <div class="diff">${diffTxt}</div>
        </div>
      </article>`;
  }

  const line = p => {
    const d = rm1v1(p.profileId);
    return `<div><span class="swatch" style="--pc:${esc(color(p) || '')}"></span><strong>${esc(p.name)}</strong> <span class="pid">(${esc(p.profileId)})</span>, RM 1v1 ${d?.rating ?? (d?.none ? '—' : '…')}, ${esc(p.civName || p.civ || '?')}</div>`;
  };

  function render(m, live, src) {
    const isNew = !current || current.match.matchId !== m.matchId || (live && !current.live);
    current = { match: m, live, src };
    const { me, allies, rivals } = split(m);
    loadProfiles(players(m).map(p => p.profileId));
    const mode = m.leaderboardName || m.gameModeName || 'Partida';
    let result = '';
    if (!live && me) result = me.won === true ? '<span class="result win">Victoria</span>'
      : me.won === false ? '<span class="result loss">Derrota</span>' : '<span>Sin resultado todavía</span>';

    $('#scene').className = 'scene ' + (live ? 'live' : 'past');
    $('#scene').innerHTML = `
      <span class="state ${live ? 'live' : 'past'}">${live ? 'Jugando ahora' : 'Última partida'}</span>
      <div class="head">
        ${m.mapImageUrl ? `<img class="mapimg" src="${esc(m.mapImageUrl)}" alt="">` : '<div class="mapimg"></div>'}
        <div>
          <h2 class="mapname">${esc(m.mapName || m.map || 'Mapa desconocido')}</h2>
          <div class="modes"><span>${esc(mode)}</span>${m.server ? `<span>Servidor ${esc(m.server)}</span>` : ''}${result}</div>
        </div>
        <div class="clock">${live
          ? `<b id="elapsed">${clock(Date.now() - new Date(m.started))}</b><span>desde que arrancó</span>`
          : `<b>${m.finished ? clock(new Date(m.finished) - new Date(m.started)) : '—'}</b><span>${m.finished ? 'de partida, terminó ' + ago(m.finished) : 'empezó ' + ago(m.started)}</span>`}</div>
      </div>
      <div class="rivals ${rivals.length === 1 ? 'solo' : ''} ${isNew && live ? 'enter' : ''}">
        ${rivals.length ? rivals.map(p => rivalCard(p, me, m)).join('') : '<div class="note"><p>No hay rivales en esta partida.</p></div>'}
      </div>
      <div class="side">
        ${me ? line(me) : ''}
        ${allies.map(line).join('')}
      </div>`;

    document.title = live && rivals.length
      ? `⚔ ${rivals.map(p => `${p.name} (${rm1v1(p.profileId)?.rating ?? p.rating ?? '?'})`).join(', ')}`
      : baseTitle();
  }

  function renderNote(title, html) {
    current = null;
    $('#scene').className = 'scene';
    $('#scene').innerHTML = `<div class="note"><h2>${title}</h2>${html}</div>`;
  }

  setInterval(() => {
    const el = document.getElementById('elapsed');
    if (el && current?.live) el.textContent = clock(Date.now() - new Date(current.match.started));
  }, 1000);

  // ---------- REST: última partida (y respaldo si el websocket falla) ----------
  async function loadLast() {
    try {
      const url = `${API}/matches?profile_ids=${encodeURIComponent(profileId)}&use_enums=true&page=1&per_page=1&language=${LANG}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const m = camel(await r.json()).matches?.[0];
      if (current?.live && current.src === 'ws') return; // el socket manda mientras hay partida en vivo
      if (!m) return renderNote('Sin partidas', '<p>No hay partidas registradas para ese Profile ID. Revisá el número.</p>');
      render(m, stillRunning(m), 'rest');
    } catch (e) {
      if (!current && window.top !== window.self) return renderNote('Abrilo fuera de esta vista previa',
        `<p>Esta vista previa bloquea las conexiones a APIs externas.</p>
         <p>Descargá el archivo y abrilo con doble clic en Chrome, Edge o Firefox.</p>`);
      if (!current) renderNote('No pude leer la API de aoe2companion',
        `<p>Detalle: ${esc(e.message)}.</p>
         <p>Si abriste el archivo con doble clic y el navegador bloquea las consultas, servilo desde un servidor local:
         en esta carpeta corré <code>php -S localhost:8080</code> y abrí <code>http://localhost:8080/</code>.</p>`);
    }
  }

  // ---------- WebSocket: partidas en curso en tiempo real ----------
  function pickLive() {
    const mine = [...ongoing.values()].filter(m => players(m).some(isMe))
      .sort((a, b) => new Date(b.started) - new Date(a.started));
    if (mine[0]) render(mine[0], true, 'ws');
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (socket) { socket.onclose = null; socket.close(); }
    ongoing.clear();
    wsUp = false;
    setStatus('connecting');
    try {
      socket = new WebSocket(`${WS}?handler=ongoing-matches&profile_ids=${encodeURIComponent(profileId)}&language=${LANG}`);
    } catch { return retry(); }
    socket.onopen = () => { wsUp = true; reconnectDelay = 2000; setStatus('live'); };
    socket.onmessage = ev => {
      let msg;
      try { msg = camel(JSON.parse(ev.data)); } catch { return; }
      if (!Array.isArray(msg)) return; // pong u otros mensajes de control
      for (const e of msg) {
        const id = e.data?.matchId;
        if (id == null) continue;
        if (e.type === 'matchAdded') ongoing.set(id, e.data);
        else if (e.type === 'matchUpdated') ongoing.set(id, { ...ongoing.get(id), ...e.data });
        else if (e.type === 'matchRemoved') {
          const ended = ongoing.get(id);
          ongoing.delete(id);
          if (ended && current?.live && current.match.matchId === id) {
            render({ ...ended, finished: new Date().toISOString() }, false, 'ws');
            setTimeout(loadLast, 10000); // damos tiempo a que se registre el resultado
          }
        }
      }
      pickLive();
    };
    socket.onclose = () => { wsUp = false; setStatus('off'); retry(); };
  }
  function retry() {
    setStatus('off');
    reconnectTimer = setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 60000);
  }

  setInterval(() => { if (!(current?.live && current.src === 'ws' && wsUp)) loadLast(); }, POLL_MS);

  // ---------- perfil ----------
  function follow(id) {
    profileId = String(id).trim();
    store('aoe2-profile-id', profileId);
    $('#pid').value = profileId;
    try { history.replaceState(null, '', '?id=' + encodeURIComponent(profileId) + location.hash); } catch {}
    current = null;
    renderNote('Buscando la última partida…', '');
    connect();
    loadLast();
  }
  $('#who').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#pid').value.replace(/\D/g, '');
    if (v) follow(v);
  });

  // ---------- CLAN ----------
  const clan = {
    tag: new URLSearchParams(location.search).get('clan') || store('aoe2-clan') || DEFAULT_CLAN,
    members: [], lb1: new Map(), lbt: new Map(), ongoing: new Map(),
    loaded: false, loading: false, error: null, sort: 'r1',
    socket: null, socketKey: '', socketUp: false, retryTimer: null, delay: 2000,
  };
  const EYE = '<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const flagImg = cc => cc ? `<img class="flag" src="https://flagcdn.com/w40/${esc(cc)}.png" alt="" onerror="this.remove()">` : '';

  async function getJson(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return camel(await r.json());
  }

  async function loadClan() {
    const tag = clan.tag;
    clan.loading = true;
    try {
      const q = `clan=${encodeURIComponent(tag)}&per_page=100&page=1&language=${LANG}`;
      const [mem, l1, lt] = await Promise.all([
        getJson(`${API}/profiles?${q}`),
        getJson(`${API}/leaderboards/rm_1v1?${q}`).catch(() => null),
        getJson(`${API}/leaderboards/rm_team?${q}`).catch(() => null),
      ]);
      if (tag !== clan.tag) return; // cambiaron el clan mientras cargaba
      clan.members = mem.profiles || [];
      clan.lb1 = new Map((l1?.players || []).map(p => [String(p.profileId), p]));
      clan.lbt = new Map((lt?.players || []).map(p => [String(p.profileId), p]));
      clan.error = null;
      clan.loaded = true;
      // Los que no aparecen en ningún leaderboard del clan se consultan de a uno.
      loadProfiles(clan.members.map(m => m.profileId).filter(id => !clan.lb1.has(String(id)) && !clan.lbt.has(String(id))));
      connectClan();
    } catch (e) {
      if (tag === clan.tag) clan.error = e.message;
    } finally {
      if (tag === clan.tag) { clan.loading = false; renderClan(); }
    }
  }

  function memberInfo(mem) {
    const id = String(mem.profileId);
    const a = clan.lb1.get(id), b = clan.lbt.get(id);
    const entry = profiles.get(id), d = entry?.data;
    const pending = !a && !b && (!entry || (entry.loading && !d));
    const lasts = [a?.lastMatchTime, b?.lastMatchTime, d?.rm1v1?.last, d?.team?.last].filter(Boolean).map(t => new Date(t));
    let match = null;
    for (const m of clan.ongoing.values()) {
      if (players(m).some(p => String(p.profileId) === id) && (!match || new Date(m.started) > new Date(match.started))) match = m;
    }
    return {
      mem, pending, match,
      r1: a?.rating ?? d?.rm1v1?.rating ?? null,
      rt: b?.rating ?? d?.team?.rating ?? null,
      last: lasts.length ? new Date(Math.max(...lasts)) : null,
    };
  }

  function statusHtml(r) {
    const m = r.match;
    if (!m) return `<span class="idle">${r.last ? 'Jugó ' + ago(r.last) : '—'}</span>`;
    const all = players(m);
    const me = all.find(p => String(p.profileId) === String(r.mem.profileId));
    const map = m.mapName || m.map || 'Partida';
    let txt;
    if (all.length === 2) {
      txt = `${map} vs ${all.find(p => p !== me)?.name ?? '?'}`;
    } else {
      const sizes = Object.values(all.reduce((acc, p) => (p.team != null && p.team >= 0 && (acc[p.team] = (acc[p.team] || 0) + 1), acc), {}));
      txt = sizes.length === 2 ? `${map} ${sizes[0]}v${sizes[1]}` : `${map}, ${all.length} jugadores`;
      const clanIds = new Set(clan.members.map(x => String(x.profileId)));
      const mates = all.filter(p => p !== me && me && p.team === me.team && clanIds.has(String(p.profileId))).map(p => p.name);
      if (mates.length) txt += ` con ${mates.join(', ')}`;
    }
    return `<a class="live" href="aoe2de://1/${esc(m.matchId)}" title="Ver la partida en el juego">${EYE}${esc(txt)}</a>`;
  }

  function renderClan() {
    const el = $('#clanView');
    if (!clan.loaded) {
      el.innerHTML = clan.error
        ? `<div class="note"><h2>No pude cargar el clan ${esc(clan.tag)}</h2><p>Detalle: ${esc(clan.error)}.</p></div>`
        : `<div class="note"><h2>Cargando el clan ${esc(clan.tag)}…</h2></div>`;
      return;
    }
    if (!clan.members.length) {
      el.innerHTML = `<div class="note"><h2>Sin integrantes</h2><p>No encontramos a nadie en el clan <strong>${esc(clan.tag)}</strong>. Tiene que ser el tag del clan oficial del juego, escrito igual que en el juego.</p></div>`;
      return;
    }
    const num = (x, k) => x[k] ?? -1;
    const rows = clan.members.map(memberInfo).sort((a, b) =>
      clan.sort === 'name'   ? String(a.mem.name).localeCompare(String(b.mem.name), 'es', { sensitivity: 'base' }) :
      clan.sort === 'status' ? (!!b.match - !!a.match) || ((b.last || 0) - (a.last || 0)) :
      clan.sort === 'rt'     ? (num(b, 'rt') - num(a, 'rt')) || (num(b, 'r1') - num(a, 'r1')) :
                               (num(b, 'r1') - num(a, 'r1')) || (num(b, 'rt') - num(a, 'rt')));
    const playing = rows.filter(r => r.match).length;
    const th = (key, label, cls = '') =>
      `<th class="${cls}" scope="col"><button type="button" data-sort="${key}" aria-pressed="${clan.sort === key}">${label}${clan.sort === key ? ' ▾' : ''}</button></th>`;
    const cell = (v, r) => v ?? (r.pending ? '…' : '—');
    el.innerHTML = `
      <div class="clanhead">
        <h2 class="clanname">${esc(clan.tag)}</h2>
        <div class="modes"><span>${rows.length} integrantes</span><span class="${playing ? 'playing' : ''}">${playing ? `${playing} jugando ahora` : 'Nadie jugando ahora'}</span></div>
      </div>
      <div class="tablewrap"><table class="clan">
        <thead><tr>${th('r1', '1v1', 'num')}${th('rt', 'TG', 'num')}${th('name', 'Jugador')}${th('status', 'Estado', 'st')}</tr></thead>
        <tbody>${rows.map(r => {
          const cc = (r.mem.country || '').toLowerCase();
          const you = String(r.mem.profileId) === String(profileId);
          return `<tr class="${you ? 'you' : ''}">
            <td class="num r1">${cell(r.r1, r)}</td>
            <td class="num rt">${cell(r.rt, r)}</td>
            <td class="who">${flagImg(cc)}<a href="https://www.aoe2companion.com/profile/${esc(r.mem.profileId)}" target="_blank" rel="noopener">${esc(r.mem.name)}</a> <span class="pid">(${esc(r.mem.profileId)})</span><div class="st-m">${statusHtml(r)}</div></td>
            <td class="st">${statusHtml(r)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;
    if (view === 'clan' && !(current?.live)) document.title = baseTitle();
  }

  $('#clanView').addEventListener('click', e => {
    const b = e.target.closest('[data-sort]');
    if (b) { clan.sort = b.dataset.sort; renderClan(); }
  });

  function connectClan() {
    const ids = clan.members.map(m => m.profileId).join(',');
    if (clan.socket && clan.socketKey === ids && clan.socketUp) return;
    clearTimeout(clan.retryTimer);
    if (clan.socket) { clan.socket.onclose = null; clan.socket.close(); clan.socket = null; }
    clan.ongoing.clear();
    clan.socketKey = ids;
    clan.socketUp = false;
    if (!ids) return;
    setClanStatus('connecting');
    let ws;
    try {
      ws = new WebSocket(`${WS}?handler=ongoing-matches&profile_ids=${encodeURIComponent(ids)}&language=${LANG}`);
    } catch { return retryClan(); }
    clan.socket = ws;
    ws.onopen = () => { clan.socketUp = true; clan.delay = 2000; setClanStatus('live'); };
    ws.onmessage = ev => {
      let msg;
      try { msg = camel(JSON.parse(ev.data)); } catch { return; }
      if (!Array.isArray(msg)) return;
      for (const e of msg) {
        const id = e.data?.matchId;
        if (id == null) continue;
        if (e.type === 'matchAdded') clan.ongoing.set(id, e.data);
        else if (e.type === 'matchUpdated') clan.ongoing.set(id, { ...clan.ongoing.get(id), ...e.data });
        else if (e.type === 'matchRemoved') clan.ongoing.delete(id);
      }
      renderClan();
    };
    ws.onclose = () => { clan.socketUp = false; retryClan(); };
  }
  function retryClan() {
    setClanStatus('off');
    clan.retryTimer = setTimeout(connectClan, clan.delay);
    clan.delay = Math.min(clan.delay * 2, 60000);
  }

  function openClan(tag) {
    clan.tag = String(tag).trim();
    store('aoe2-clan', clan.tag);
    $('#tag').value = clan.tag;
    clan.loaded = false;
    clan.members = [];
    clan.error = null;
    if (clan.socket) { clan.socket.onclose = null; clan.socket.close(); clan.socket = null; }
    clearTimeout(clan.retryTimer);
    clan.ongoing.clear();
    clan.socketKey = '';
    setClanStatus('connecting');
    renderClan();
    loadClan();
  }
  $('#clanForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#tag').value.trim();
    if (v) openClan(v);
  });

  // Ratings y "hace X" se refrescan solos mientras la sección está abierta.
  setInterval(() => { if (view === 'clan' && clan.loaded && !clan.loading) loadClan(); }, 5 * 60e3);
  setInterval(() => { if (view === 'clan' && clan.loaded) renderClan(); }, 60e3);

  // ---------- secciones ----------
  function show(v) {
    view = v === 'clan' ? 'clan' : 'rival';
    $('#scene').hidden = view !== 'rival';
    $('#who').hidden = view !== 'rival';
    $('#clanView').hidden = view !== 'clan';
    $('#clanForm').hidden = view !== 'clan';
    document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.view === view ? 'page' : 'false'));
    paintStatus();
    if (view === 'clan') {
      $('#tag').value = clan.tag;
      if (!clan.loaded && !clan.loading) openClan(clan.tag);
      else renderClan();
    } else if (!(current?.live)) document.title = baseTitle();
  }
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));

  follow(profileId);
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
